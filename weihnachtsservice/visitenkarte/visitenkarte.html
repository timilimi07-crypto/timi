// feste Schneeflocken (immer gleich, damit der Druck reproduzierbar ist)
function flocken(id, seed, frei) {
  var el = document.getElementById(id), s = seed;
  function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  for (var i = 0; i < 46; i++) {
    var x = r() * 91, y = r() * 61, d = .3 + r() * .7;
    if (frei(x, y)) continue;
    var b = document.createElement("b");
    b.style.cssText = "left:" + x + "mm;top:" + y + "mm;width:" + d + "mm;height:" + d + "mm";
    el.appendChild(b);
  }
}
