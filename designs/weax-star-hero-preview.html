<title>WEAX Star Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>:root{color-scheme:dark;--page:#050507}html,body{background:var(--page);color:#dfe3e8;margin:0}
.pv-bar{display:flex;gap:10px;justify-content:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));font:12px/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9aa0a8;flex-wrap:wrap;align-items:center}
.pv-bar button{background:none;border:1px solid #3a3d44;color:#dfe3e8;border-radius:99px;padding:9px 16px;font:inherit;letter-spacing:inherit;cursor:pointer}
.pv-bar button:focus-visible{outline:2px solid #dfe3e8}</style>



<style>
  /* Schrift lokal (Datei "Cinzel.woff2" unter Assets). Fehlt sie, wird eine Ersatzschrift genutzt. */
  @font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 400 900; font-display: swap; src: url(about:blank) format('woff2'); }

  #wsh-preview {
    --bg: #050507;
    --chrome: #dfe3e8;
    position: relative; overflow: hidden; isolation: isolate;
    min-height: 100svh;
    display: grid; place-items: center;
    padding: 96px 20px 120px;
    background: radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--chrome) 5%, var(--bg)), var(--bg) 60%);
    color: var(--chrome); text-align: center;
  }
  #wsh-preview .wsh__canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  #wsh-preview .wsh__content { position: relative; z-index: 2; display: grid; justify-items: center; gap: 0; max-width: 900px; }
  #wsh-preview .wsh__anchor { width: 120px; height: clamp(110px, 18vw, 170px); }
  #wsh-preview .wsh__eyebrow { font-size: 12px; letter-spacing: .45em; text-transform: uppercase; margin: 8px 0 0; opacity: .7; }
  #wsh-preview .wsh__title {
    font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 500;
    font-size: clamp(48px, 11vw, 120px); line-height: 1; letter-spacing: .22em; margin: 18px 0 0 .22em;
  }
  #wsh-preview .wsh__title span {
    display: inline-block;
    background: linear-gradient(100deg, #b9bec6 0%, #b9bec6 40%, #ffffff 50%, #b9bec6 60%, #b9bec6 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: wsh-shine-preview 9s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .12s);
  }
  #wsh-preview .wsh__logo { width: min(70vw, 420px); height: auto; margin-top: 14px; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--chrome) 25%, transparent)); }
  #wsh-preview .wsh__sub { max-width: 460px; margin: 24px auto 0; line-height: 1.7; font-size: 15px; letter-spacing: .04em; opacity: .65; }
  #wsh-preview .wsh__btn {
    display: inline-flex; align-items: center; gap: 14px; margin-top: 40px;
    padding: 15px 34px; border-radius: 99px; text-decoration: none; font-weight: 500; letter-spacing: .28em;
    text-transform: uppercase; font-size: 12px; color: var(--chrome);
    border: 1px solid color-mix(in srgb, var(--chrome) 45%, transparent); background: transparent;
    transition: background .4s ease, color .4s ease, border-color .4s ease;
  }
  #wsh-preview .wsh__btn:hover, #wsh-preview .wsh__btn:focus-visible { background: var(--chrome); color: var(--bg); border-color: var(--chrome); outline: none; }
  #wsh-preview .wsh__btn svg { transition: transform .4s ease; }
  #wsh-preview .wsh__btn:hover svg { transform: translateX(4px); }
  #wsh-preview .wsh__btn svg { width: 14px; height: 14px; }

  #wsh-preview .wsh__skip {
    position: absolute; right: 18px; bottom: 18px; z-index: 3;
    background: none; border: 1px solid color-mix(in srgb, var(--chrome) 30%, transparent); color: var(--chrome);
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase; padding: 9px 14px; border-radius: 99px; cursor: pointer;
    opacity: .7; transition: opacity .4s;
  }
  #wsh-preview .wsh__skip:hover, #wsh-preview .wsh__skip:focus-visible { opacity: 1; outline: none; }
  #wsh-preview.is-btn .wsh__skip { opacity: 0; pointer-events: none; }

  #wsh-preview .wsh__scroll { position: absolute; left: 50%; bottom: 22px; z-index: 2; width: 1px; height: 44px; transform: translateX(-50%); background: color-mix(in srgb, var(--chrome) 25%, transparent); overflow: hidden; }
  #wsh-preview .wsh__scroll::after { content: ""; position: absolute; left: 0; top: -40%; width: 1px; height: 40%; background: var(--chrome); animation: wsh-drop-preview 2s ease-in-out infinite; }

  /* Intro-Zustände – nur wenn das Script läuft, sonst ist alles direkt sichtbar */
  #wsh-preview.js .wsh__eyebrow,
  #wsh-preview.js .wsh__sub,
  #wsh-preview.js .wsh__btn,
  #wsh-preview.js .wsh__scroll { opacity: 0; transform: translateY(10px); transition: opacity 1.4s ease, transform 1.8s cubic-bezier(.22,1,.36,1); }
  #wsh-preview.js .wsh__title { letter-spacing: .4em; transition: letter-spacing 2.6s cubic-bezier(.22,1,.36,1); }
  #wsh-preview.js .wsh__title span { opacity: 0; transform: translateY(10px);
    transition: opacity 1.6s ease, transform 2s cubic-bezier(.22,1,.36,1); transition-delay: calc(var(--i, 0) * 120ms); }
  #wsh-preview.js .wsh__logo { opacity: 0; transform: translateY(10px); transition: opacity 1.6s ease, transform 2s cubic-bezier(.22,1,.36,1); }

  #wsh-preview.is-title .wsh__title { letter-spacing: .18em; }
  #wsh-preview.is-title .wsh__title span { opacity: 1; transform: none; }
  #wsh-preview.is-title .wsh__logo { opacity: 1; transform: none; }
  #wsh-preview.is-title .wsh__eyebrow { opacity: .7; transform: none; }
  #wsh-preview.is-sub .wsh__sub { opacity: .65; transform: none; }
  #wsh-preview.is-btn .wsh__btn { opacity: 1; transform: none; }
  #wsh-preview.is-btn .wsh__scroll { opacity: 1; transform: translateX(-50%); }

  @keyframes wsh-shine-preview { 0%, 55% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes wsh-drop-preview { 0% { top: -40%; } 100% { top: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    #wsh-preview *, #wsh-preview *::after { animation: none !important; transition: none !important; }
  }
</style>

<section
  id="wsh-preview"
  class="wsh"
  data-chrome="#dfe3e8"
  data-speed="1"
  data-once="false"
>
  <canvas class="wsh__canvas" aria-hidden="true"></canvas>

  <div class="wsh__content">
    <div class="wsh__anchor" aria-hidden="true"></div>
    
      <p class="wsh__eyebrow">New Collection</p>
    
    
      <h1 class="wsh__title">WEAX</h1>
    
    
      <p class="wsh__sub">Gemacht, um zu bleiben.</p>
    
    
      <a class="wsh__btn" href="#">
        Shop entdecken
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    
  </div>

  
    <button type="button" class="wsh__skip">Intro überspringen</button>
  
  <div class="wsh__scroll" aria-hidden="true"></div>
</section>

<script>
(function () {
  var root = document.getElementById('wsh-preview');
  if (!root || root.dataset.init) return;
  root.dataset.init = '1';
  root.classList.add('js');

  var canvas = root.querySelector('.wsh__canvas');
  var ctx = canvas.getContext('2d');
  var anchor = root.querySelector('.wsh__anchor');
  var title = root.querySelector('.wsh__title');
  var skipBtn = root.querySelector('.wsh__skip');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var speed = parseFloat(root.dataset.speed) || 1;
  var KEY = 'weax-intro-seen';

  // Titel in einzelne Buchstaben zerlegen (für das Einblenden)
  if (title) {
    var txt = title.textContent.trim();
    title.textContent = '';
    title.setAttribute('aria-label', txt);
    txt.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.setProperty('--i', i);
      s.setAttribute('aria-hidden', 'true');
      title.appendChild(s);
    });
  }

  function hexToRgb(hex) {
    hex = (hex || '#dfe3e8').replace('#', '');
    if (hex.length === 3) hex = hex.replace(/(.)/g, '$1$1');
    var n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  var C = hexToRgb(root.dataset.chrome);
  function col(a) { return 'rgba(' + C[0] + ',' + C[1] + ',' + C[2] + ',' + a + ')'; }
  function white(a) { return 'rgba(255,255,255,' + a + ')'; }

  var D = { field: 900 * speed, travel: 2800 * speed, title: 500 * speed, sub: 1500 * speed, btn: 2100 * speed };
  var W = 0, H = 0, DPR = 1, ax = 0, ay = 0, starR = 36, P = [];
  var stars = [], parts = [];
  var T0 = null, last = null, arrivedAt = null, done = false, raf = null, onScreen = true;
  var mx = 0, my = 0, pmx = 0, pmy = 0, timers = [];

  function bez(t) {
    var u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]];
  }
  function easeTravel(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }

  function resize() {
    var r = root.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var a = anchor.getBoundingClientRect();
    ax = a.left - r.left + a.width / 2; ay = a.top - r.top + a.height / 2;
    starR = Math.max(18, Math.min(34, W * 0.03));
    root.style.setProperty('--fx', (ax / W * 100) + '%');
    root.style.setProperty('--fy', (ay / H * 100) + '%');
    // Weiter S-Bogen: von links unten sanft hoch in die Mitte
    P = [[-0.08 * W, 0.62 * H], [0.18 * W, 0.98 * H], [ax - 0.12 * W, ay + 0.08 * H], [ax, ay]];
    var count = Math.min(170, Math.round(W * H / 9000));
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.2, d: Math.random() * 0.6 + 0.15, ph: Math.random() * 6.28, sp: Math.random() * 0.002 + 0.0007 });
    }
  }

  function star8(x, y, R, rot, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot || 0);
    ctx.beginPath();
    for (var i = 0; i < 16; i++) {
      var ang = i * Math.PI / 8 - Math.PI / 2;
      var rr = (i % 2 === 1) ? R * 0.12 : (i % 4 === 0 ? R : R * 0.48);
      var px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var g = ctx.createLinearGradient(-R, -R, R, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, col(1)); g.addColorStop(0.7, '#ffffff'); g.addColorStop(1, col(1));
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = g; ctx.shadowColor = col(1); ctx.shadowBlur = R * 0.9;
    ctx.fill();
    ctx.restore();
  }

  function glow(x, y, r, a) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, white(a)); g.addColorStop(0.25, col(a * 0.5)); g.addColorStop(1, col(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }

  function strokePath(t0, t1, alpha, width) {
    var n = 140, p = bez(t0);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (var i = 1; i <= n; i++) { p = bez(t0 + (t1 - t0) * i / n); ctx.lineTo(p[0], p[1]); }
    ctx.strokeStyle = col(alpha); ctx.lineWidth = width; ctx.stroke();
  }

  function drawStars(now, fade) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph))) * fade * s.d;
      var x = s.x + pmx * 8 * s.d, y = s.y + pmy * 8 * s.d;
      ctx.fillStyle = white(a);
      ctx.fillRect(x, y, s.r, s.r);
    }
  }

  function drawTrail(t, now) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    strokePath(0, t, 0.12, 0.8);                       // die Linie, die stehen bleibt
    var L = 0.3, n = 48, t0 = Math.max(0, t - L), prev = bez(t0);
    for (var i = 1; i <= n; i++) {
      var k = i / n, p = bez(t0 + (t - t0) * k);
      ctx.strokeStyle = k > 0.9 ? white(0.85 * k) : col(0.02 + 0.6 * k * k);
      ctx.lineWidth = 0.3 + 1.6 * k * k;
      ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
      prev = p;
    }
    var h = bez(t);
    glow(h[0], h[1], 16, 0.7);
    ctx.fillStyle = white(1); ctx.beginPath(); ctx.arc(h[0], h[1], 1.6, 0, 6.2832); ctx.fill();
    ctx.restore();
    // ganz vereinzelt ein feiner Funke
    if (Math.random() < 0.25) {
      parts.push({ x: h[0], y: h[1], vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, life: 0, max: 900 + Math.random() * 600, r: Math.random() * 0.8 + 0.3 });
    }
  }

  function arrive(now, quiet) {
    if (arrivedAt !== null) return;
    arrivedAt = now;
    if (!quiet) {
      root.classList.add('is-arrived');
      timers.push(setTimeout(function () { root.classList.add('is-title'); }, D.title));
      timers.push(setTimeout(function () { root.classList.add('is-sub'); }, D.sub));
      timers.push(setTimeout(function () { root.classList.add('is-btn'); }, D.btn));
    } else {
      root.classList.add('is-title', 'is-sub', 'is-btn');
    }
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }

  function drawAfter(now) {
    var k = now - arrivedAt;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // WEAX LINE: der Schweif bleibt fein stehen, ein Lichtschimmer gleitet langsam darüber
    strokePath(0, 1, 0.14, 0.8);
    var s = (now / (6000 * speed)) % 1;
    strokePath(Math.max(0, s - 0.12), s, 0.35, 1);

    // Stern: weich einblenden und leicht wachsen
    var a = Math.min(1, k / 1400), e = easeOut(a);
    glow(ax, ay, starR * 2.4, (0.16 + 0.03 * Math.sin(now / 1800)) * e);
    star8(ax, ay, starR * (0.7 + 0.3 * e) * (1 + 0.015 * Math.sin(now / 1500)), 0, e);

    // Orbit-Ring zeichnet sich langsam
    var g = easeOut(Math.min(1, Math.max(0, (k - 300) / 2000)));
    if (g > 0) {
      var rx = starR * 2.9, ry = rx * 0.28, rot = -0.32;
      ctx.lineWidth = 0.9;
      ctx.strokeStyle = col(0.42);
      ctx.beginPath(); ctx.ellipse(ax, ay, rx, ry, rot, -Math.PI / 2, -Math.PI / 2 + g * 2 * Math.PI); ctx.stroke();
      if (g >= 1) {
        var oa = (now * 0.0005) % 6.2832;
        var ox = ax + Math.cos(oa) * rx * Math.cos(rot) - Math.sin(oa) * ry * Math.sin(rot);
        var oy = ay + Math.cos(oa) * rx * Math.sin(rot) + Math.sin(oa) * ry * Math.cos(rot);
        glow(ox, oy, 6, 0.5);
      }
    }
    ctx.restore();
  }

  function drawParts(dt) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life += dt;
      var f = dt / 16;
      p.vx *= Math.pow(0.955, f); p.vy *= Math.pow(0.955, f); p.vy += 0.015 * f;
      p.x += p.vx * f; p.y += p.vy * f;
      var a = 1 - p.life / p.max;
      if (a <= 0) { parts.splice(i, 1); continue; }
      a *= 0.6 + 0.4 * Math.sin(p.life * 0.03);
      ctx.fillStyle = Math.random() < 0.15 ? white(a) : col(a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    if (parts.length > 900) parts.splice(0, parts.length - 900);
    ctx.restore();
  }

  function render(now, dt) {
    pmx += (mx - pmx) * 0.03; pmy += (my - pmy) * 0.03;
    ctx.clearRect(0, 0, W, H);
    var el = now - T0;
    drawStars(now, done ? 1 : Math.min(1, el / D.field));
    if (arrivedAt === null) {
      var u = Math.max(0, (el - D.field * 0.6) / D.travel);
      if (u < 1) drawTrail(easeTravel(u), now);
      else arrive(now, false);
    }
    if (arrivedAt !== null) drawAfter(now);
    drawParts(dt);
  }

  function frame(now) {
    raf = null;
    if (T0 === null) T0 = now;
    var dt = last === null ? 16 : Math.min(50, now - last);
    last = now;
    render(now, dt);
    if (onScreen && !reduce) raf = requestAnimationFrame(frame);
  }

  function start() { if (!raf && onScreen && !reduce) { last = null; raf = requestAnimationFrame(frame); } }

  function finish() {
    if (arrivedAt !== null) { root.classList.add('is-title', 'is-sub', 'is-btn'); return; }
    done = true;
    arrive(performance.now() - 5000, true);
  }

  function replay() {
    timers.forEach(clearTimeout); timers = [];
    root.classList.remove('is-arrived', 'is-title', 'is-sub', 'is-btn');
    void root.offsetWidth;
    T0 = null; arrivedAt = null; done = false; parts = [];
    start();
  }
  root.weaxReplay = replay;

  resize();

  var seen = false;
  try { seen = root.dataset.once === 'true' && sessionStorage.getItem(KEY) === '1'; } catch (e) {}
  if (window.Shopify && window.Shopify.designMode) seen = false;

  if (reduce) {
    done = true; T0 = 0; arrive(-1e7, true);
    render(1e6, 16);
  } else {
    if (seen) { done = true; arrive(-1e7, true); }
    start();
  }

  if (skipBtn) skipBtn.addEventListener('click', finish);
  root.addEventListener('pointermove', function (e) {
    var r = root.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width - 0.5; my = (e.clientY - r.top) / r.height - 0.5;
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (reduce) render(1e6, 16); }, 150);
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      if (onScreen) start();
    }).observe(root);
  }
})();
</script>


<div class="pv-bar"><span>Vorschau – so sieht die Startseite aus</span><button type="button" id="pv-replay">Intro nochmal abspielen</button></div>
<script>document.getElementById('pv-replay').addEventListener('click',function(){var r=document.getElementById('wsh-preview');if(r.weaxReplay){r.weaxReplay();window.scrollTo(0,0);}});</script>
