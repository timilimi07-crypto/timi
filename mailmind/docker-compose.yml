# MailMind – lokaler Start: docker compose up --build
# App: http://localhost:3000  (Demo-Login: admin@mueller-partner.de / mailmind)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmind
      POSTGRES_PASSWORD: mailmind
      POSTGRES_DB: mailmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Einmaliger Job: Migrationen ausführen und (bei leerer DB) Demo-Daten anlegen.
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailmind:mailmind@postgres:5432/mailmind?schema=public
    command: >
      sh -c "npx prisma migrate deploy &&
             if [ \"$${DEMO_MODE:-true}\" = \"true\" ]; then npm run db:seed:if-empty; fi"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailmind:mailmind@postgres:5432/mailmind?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Hintergrund-Worker (BullMQ): automatischer Abruf aller Postfächer,
  # ab Phase 3 auch die KI-Verarbeitung. Nutzt das Builder-Image (tsx).
  worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailmind:mailmind@postgres:5432/mailmind?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: ["npm", "run", "worker"]
    # Für AI_PROVIDER=ollama mit Ollama auf dem Host-Rechner:
    # OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Test-Mailserver: fängt alle ausgehenden Mails ab (z. B. den Tages-Digest).
  # Web-Oberfläche: http://localhost:8025 · In .env: SMTP_URL="smtp://mailpit:1025"
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # Optional: lokales KI-Modell (kostenlos, für Tests ohne Anthropic-Schlüssel).
  # Start: docker compose --profile ollama up -d
  # Modell laden: docker compose exec ollama ollama pull qwen2.5:7b
  # In .env: AI_PROVIDER=ollama und OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  redisdata:
  ollamadata:
