<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>T.I.M.I.</title>
  <meta name="theme-color" content="#01070d" />
  <meta name="description" content="Persönlicher KI-Assistent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timi" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Design vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
    try {
      const look = JSON.parse(localStorage.getItem("look") || "{}");
      if (look.theme) document.documentElement.dataset.theme = look.theme;
    } catch {}
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="scan"></div>
    <div class="vignette"></div>
  </div>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-name">T.I.M.I.</span>
      <span class="brand-sub">Persönliches Assistenzsystem</span>
    </div>
    <div class="clock">
      <span id="clock-time">--:--</span>
      <span id="clock-date"></span>
    </div>
    <div class="top-right">
      <div class="chips" id="chips" title="Verbindungen"></div>
      <button class="gear" data-open="einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <nav class="dock" aria-label="Fenster">
    <button class="dock-btn" data-open="kalender" title="Kalender">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Kalender</span>
    </button>
    <button class="dock-btn" data-open="aufgaben" title="Aufgaben">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
      <span>Aufgaben</span>
    </button>
    <button class="dock-btn" data-open="notizen" title="Gedächtnis">
      <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.2 4.6.6.6.8 1.2.8 2V17h6v-1.4c0-.8.3-1.4.8-2 1-1 2.2-2.4 2.2-4.6a6 6 0 0 0-6-6Z"/><path d="M9.5 20.5h5"/></svg>
      <span>Gedächtnis</span>
    </button>
    <button class="dock-btn" data-open="mails" title="Mails">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <span>Mails</span>
    </button>
    <button class="dock-btn" data-open="musik" title="Musik">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span>Musik</span>
    </button>
    <button class="dock-btn" data-open="protokoll" title="Protokoll">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span>Protokoll</span>
    </button>
    <button class="dock-btn" data-open="verbindungen" title="Verbindungen">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 11 7.6-4M8.2 13l7.6 4"/></svg>
      <span>Dienste</span>
    </button>
    <button class="dock-btn" data-open="design" title="Design und Schrift">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.2-9-7.2Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg>
      <span>Design</span>
    </button>
    <div class="dock-sep"></div>
    <button class="dock-btn small" id="handsfree" aria-pressed="true" title="Freihändig: hört nach jeder Antwort automatisch wieder zu">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Auto</span>
    </button>
    <button class="dock-btn small" id="reset" title="Neues Gespräch beginnen">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg>
      <span>Neu</span>
    </button>
  </nav>

  <main class="core">
    <button id="reactor" class="reactor" aria-label="Sprechen">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop class="g-center" offset="0%" />
            <stop class="g-mid" offset="35%" />
            <stop class="g-accent" offset="70%" stop-opacity="0.75" />
            <stop class="g-accent" offset="100%" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle class="r-outer" cx="150" cy="150" r="142" />
        <g class="spin s1"><circle class="r-ticks" cx="150" cy="150" r="130" /></g>
        <g class="spin s2"><circle class="r-bold" cx="150" cy="150" r="114" /></g>
        <g class="spin s3"><circle class="r-arc" cx="150" cy="150" r="98" /></g>
        <circle class="r-thin" cx="150" cy="150" r="84" />
        <g class="spin s4"><circle class="r-seg" cx="150" cy="150" r="68" /></g>
        <circle class="r-core" cx="150" cy="150" r="52" fill="url(#coreGlow)" />
        <circle class="r-center" cx="150" cy="150" r="22" />
      </svg>
    </button>
    <p id="status" class="status">Systeme online</p>
    <p id="interim" class="interim"></p>
    <p id="reply" class="reply"></p>
  </main>

  <div id="desktop" class="desktop"></div>

  <form id="command" class="command" autocomplete="off">
    <span class="prompt">&gt;</span>
    <input id="command-input" type="text" placeholder="Befehl eingeben oder einfach sprechen…" />
    <button type="submit" aria-label="Senden">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <template id="win-template">
    <section class="win" tabindex="-1">
      <header class="win-head">
        <span class="win-title"></span>
        <div class="win-actions">
          <button class="win-refresh" title="Aktualisieren" hidden>⟳</button>
          <button class="win-close" title="Schließen">✕</button>
        </div>
      </header>
      <div class="win-body"></div>
      <span class="win-resize" aria-hidden="true"></span>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
