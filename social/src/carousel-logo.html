<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>WEAX Logo-Karussell</title>
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 400 900; src: url(Cinzel.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  /* One wide canvas (5 × 1080) that is cut into slides, so the orbit line runs seamlessly across the swipe. */
  #pano {
    position: relative; width: 5400px; height: 1350px; overflow: hidden; color: #fff;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(ellipse 700px 600px at 540px 520px, #22252b 0%, transparent 70%),
      radial-gradient(ellipse 600px 500px at 3780px 560px, #1d2026 0%, transparent 70%),
      radial-gradient(ellipse 700px 600px at 4860px 520px, #20232a 0%, transparent 70%),
      linear-gradient(180deg, #0a0a0c, #050506);
  }
  #stars, #orbit { position: absolute; inset: 0; }
  .slide { position: absolute; top: 0; width: 1080px; height: 1350px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 90px; }
  .chrome {
    font-family: 'Cinzel', serif; font-weight: 700;
    background: linear-gradient(100deg, #6f757d 0%, #fff 25%, #9aa0a8 45%, #fff 62%, #7b8189 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .eyebrow { font-size: 26px; letter-spacing: .5em; text-transform: uppercase; opacity: .6; font-weight: 500; }
  .h { font-size: 112px; letter-spacing: .06em; line-height: 1.05; }
  .body { font-size: 36px; line-height: 1.5; opacity: .7; max-width: 800px; margin-top: 40px; }
  .num { position: absolute; top: 64px; left: 72px; font-size: 24px; letter-spacing: .3em; opacity: .4; }
  .mark { position: absolute; top: 56px; right: 72px; width: 96px; height: 58px; background: url(assets/weax-logo.png) center / contain no-repeat; opacity: .8; }
  .swipe { position: absolute; bottom: 70px; right: 72px; font-size: 26px; letter-spacing: .3em; text-transform: uppercase; opacity: .7; }
  .logo { background: url(assets/weax-logo.png) center / contain no-repeat; filter: drop-shadow(0 0 40px rgba(255,255,255,.18)); }
  /* star cropped out of the logo file */
  .star { width: 420px; height: 420px; background: url(assets/weax-star.png) center / contain no-repeat;
          filter: drop-shadow(0 0 50px rgba(255,255,255,.35)); }
  .pill {
    margin-top: 56px; padding: 28px 60px; border-radius: 999px; font-weight: 800; font-size: 30px; letter-spacing: .22em; text-transform: uppercase;
    color: #0b0b0d; background: linear-gradient(180deg, #fff, #c9cdd3 55%, #eef0f2);
    box-shadow: 0 0 0 2px rgba(255,255,255,.4) inset, 0 20px 80px -10px rgba(220,225,235,.5);
  }
  .sans { font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: -.02em; }
</style>
</head>
<body>
<div id="pano">
  <canvas id="stars" width="5400" height="1350"></canvas>
  <svg id="orbit" width="5400" height="1350" viewBox="0 0 5400 1350">
    <defs>
      <linearGradient id="orbitG" x1="0" y1="0" x2="5400" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#8f959d"/><stop offset=".12" stop-color="#fff"/><stop offset=".3" stop-color="#7b8189"/>
        <stop offset=".5" stop-color="#fff"/><stop offset=".7" stop-color="#8f959d"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#9aa0a8"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <path id="orbitPath" d="M -60 1010 C 700 1180, 1500 820, 2250 1060 S 3400 1240, 4100 1150 S 5000 1180, 5480 1250" fill="none"/>
    <use href="#orbitPath" stroke="#fff" stroke-opacity=".25" stroke-width="18" filter="url(#blur)"/>
    <use href="#orbitPath" stroke="url(#orbitG)" stroke-width="5"/>
    <path d="M -60 1050 C 700 1215, 1500 860, 2250 1095 S 3400 1275, 4100 1185 S 5000 1215, 5480 1285" fill="none" stroke="url(#orbitG)" stroke-opacity=".35" stroke-width="1.5"/>
  </svg>

  <!-- 1 -->
  <section class="slide" style="left:0; justify-content:center; padding-bottom:180px;">
    <div class="logo" style="width:860px; height:514px;"></div>
    <div class="eyebrow" style="margin-top:40px;" data-en="WEAX · Drop 01" data-de="WEAX · Drop 01"></div>
    <div class="chrome h" style="margin-top:28px;" data-en="NOT FOR<br>EVERYONE." data-de="NICHT FÜR<br>JEDEN."></div>
    <div class="swipe" data-en="Swipe →" data-de="Swipe →"></div>
  </section>

  <!-- 2 -->
  <section class="slide" style="left:1080px; justify-content:center; padding-bottom:260px;">
    <div class="num">02 / 05</div><div class="mark"></div>
    <div class="chrome h" data-en="QUIET<br>LOGO." data-de="LEISES<br>LOGO."></div>
    <div class="sans" style="font-size:96px; margin-top:20px;" data-en="Loud presence." data-de="Lauter Auftritt."></div>
    <div class="body" data-en="No loud prints. No trend of the week.<br>Just the W." data-de="Keine lauten Prints. Kein Trend der Woche.<br>Nur das W."></div>
  </section>

  <!-- 3 -->
  <section class="slide" style="left:2160px; justify-content:center; padding-bottom:300px;">
    <div class="num">03 / 05</div><div class="mark"></div>
    <div class="eyebrow" data-en="The W" data-de="Das W"></div>
    <div class="chrome h" style="margin-top:30px;" data-en="MADE<br>TO STAY." data-de="GEMACHT,<br>UM ZU<br>BLEIBEN."></div>
    <div class="body" data-en="Not for one season. For every day." data-de="Nicht für eine Saison. Für jeden Tag."></div>
  </section>

  <!-- 4 -->
  <section class="slide" style="left:3240px; justify-content:center; padding-bottom:240px;">
    <div class="num">04 / 05</div><div class="mark"></div>
    <div class="star"></div>
    <div class="chrome" style="font-size:92px; letter-spacing:.1em; margin-top:30px;" data-en="ONE STAR." data-de="EIN STERN."></div>
    <div class="body" style="margin-top:20px;" data-en="For those who know." data-de="Für die, die's wissen."></div>
  </section>

  <!-- 5 -->
  <section class="slide" style="left:4320px; justify-content:center; padding-bottom:200px;">
    <div class="logo" style="width:600px; height:359px;"></div>
    <div class="eyebrow" style="margin-top:44px; opacity:.8" data-en="Drop 01 · Limited" data-de="Drop 01 · Limitiert"></div>
    <div class="sans" style="font-size:80px; margin-top:34px;" data-en="No restock." data-de="Kein Restock."></div>
    <div class="pill" data-en="Link in bio" data-de="Link in Bio"></div>
    <div class="body" style="font-size:28px; margin-top:44px;" data-en="Save this post so you don't miss the drop." data-de="Speichern, damit du den Drop nicht verpasst."></div>
  </section>
</div>

<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'de';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en]').forEach(el => el.innerHTML = el.dataset[lang]);
  // number on slide 1 is omitted on purpose: the hook slide stays clean.

  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ctx = document.getElementById('stars').getContext('2d');
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 700; i++) {
    const r = rnd() * 1.9 + .3;
    ctx.globalAlpha = .2 + rnd() * .7;
    ctx.beginPath(); ctx.arc(rnd() * 5400, rnd() * 1350, r, 0, 6.28); ctx.fill();
  }
  window.ready = Promise.all([document.fonts.ready, new Promise(r => { const i = new Image(); i.onload = r; i.src = 'assets/weax-logo.png'; })]);
</script>
</body>
</html>
