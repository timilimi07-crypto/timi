# Netlify-Konfiguration für die Xanthi-Demo.
# In Netlify als "Base directory" den Ordner  xanthi  angeben – kein Build nötig.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Demo nicht indexieren (zusätzlich zum Meta-Tag). Vor dem Livegang entfernen!
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
